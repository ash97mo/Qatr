<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <style>

<body>

  <div id="customModalOverlay" class="custom-modal-overlay" style="display: none;" onclick="if(event.target===this) closeCustomModal()">
    <div class="custom-modal-card">
      <div id="modalIconContainer" class="modal-icon-container"></div>
      <h3 id="modalTitle" class="modal-title"></h3>
      <div id="modalMessage" class="modal-message"></div>
      <button id="modalBtn" class="modal-btn" onclick="closeCustomModal()">حسناً</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <h1>🚆 تتبع القطارات التشاركي</h1>
    </header>

    <div id="installAppPrompt" class="install-bar">
      <span id="installBarText">📲 ثبّت تطبيق القطارات على هاتفك</span>
      <button class="btn-install" id="installBarBtn" onclick="installPWA()">تثبيت الآن</button>
    </div>

    <div id="connStatus" class="status-alert status-wait">⏳ جاري الاتصال بالسيرفر اللحظي...</div>

    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabRouteBtn" onclick="switchSearchTab('ROUTE')">🔍 ابحث بالمسار</button>
      <button class="tab-btn" id="tabDirectBtn" onclick="switchSearchTab('DIRECT')">🚆 برقم القطار</button>
    </div>

    <div id="routeSearchSection" class="route-search-card">
      <div class="route-inputs-wrapper">
        <div class="station-field">
          <div class="field-label-row">
            <label>من (القيام):</label>
            <button type="button" class="btn-gps-locate" onclick="locateNearestStation('fromStationInput')">📍 موقعي</button>
          </div>
          <div class="combo-wrapper" id="fromComboWrapper">
            <input type="text" id="fromStationInput" class="combo-input" placeholder="اضغط للاختيار أو اكتب محطة القيام..." autocomplete="off">
            <div class="combo-dropdown" id="fromStationDropdown"></div>
          </div>
        </div>

        <div class="swap-btn-container">
          <button type="button" class="btn-swap-arrows" onclick="swapStations()" title="تبديل محطة القيام والوصول">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="4" x2="7" y2="20"></line>
              <polyline points="3 8 7 4 11 8"></polyline>
              <line x1="17" y1="20" x2="17" y2="4"></line>
              <polyline points="13 16 17 20 21 16"></polyline>
            </svg>
          </button>
        </div>

        <div class="station-field">
          <div class="field-label-row">
            <label>إلى (الوصول):</label>
          </div>
          <div class="combo-wrapper" id="toComboWrapper">
            <input type="text" id="toStationInput" class="combo-input" placeholder="اضغط للاختيار أو اكتب محطة الوصول..." autocomplete="off">
            <div class="combo-dropdown" id="toStationDropdown"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="closestResultContainer" class="trains-results-container" style="display: none;"></div>

    <div class="selector-box" id="directTrainSection" style="display: none;">
      <label>ابحث برقم القطار أو اختر من القائمة:</label>
      <div class="combo-wrapper" id="trainComboWrapper">
        <input type="text" id="directTrainInput" class="combo-input" placeholder="اضغط للاختيار أو اكتب رقم القطار..." autocomplete="off">
        <div class="combo-dropdown" id="directTrainDropdown"></div>
      </div>
    </div>

    <div class="role-card" id="roleCardSection" style="display: none;">
      <div class="role-title">📍 هل أنت في هذا القطار أو بالمحطة الآن؟</div>
      <div class="role-buttons">
        <button class="role-btn" id="btnRolePassenger" onclick="setUserRole('PASSENGER')">🚆 أنا راكب القطار</button>
        <button class="role-btn" id="btnRoleWaiting" onclick="setUserRole('WAITING')">⏳ منتظر بمحطة</button>
        <button class="role-btn active" id="btnRoleViewer" onclick="setUserRole('VIEWER')">👁️ مجرد متابع</button>
      </div>
    </div>

    <div class="crowd-panel" id="crowdActionPanel" style="display: none;">
      <div class="crowd-title">
        <span>مساعد المسافرين (GPS مُفعّل) 📡</span>
        <span id="gpsDistanceStatus" style="font-size: 11px; color:#facc15;"></span>
      </div>
      <div id="crowdControls"></div>
    </div>

    <div class="train-info-badge" id="trainBadgeSection" style="display: none;">
      <div>
        <div class="train-title-row">
          <span style="font-weight: bold; font-size: 14.5px;" id="trainTitle">--</span>
          <span id="trainTypeBadge" class="train-type-pill" style="display: none;"></span>
        </div>
        <div style="font-size: 12px; color: #94a3b8;" id="trainRouteName">--</div>
        <div id="updateSourceText" style="font-size: 11px; color: #64748b; margin-top: 4px;"></div>
      </div>
      <div id="statusBadge" class="status-badge">--</div>
    </div>

    <div class="route-map" id="routeMap">
      <div style="text-align: center; color: #64748b; padding: 30px 10px;">
        👈 حدد محطتي المغادرة والوصول لمعرفة مواعيد القطارات، أو اختر القطار لمتابعة مساره المباشر.
      </div>
    </div>
  </div>

  <script>
    const LIVE_STATUS_TOPIC = "egy_train_live_status_2026";
    const BROKER_HOST = "broker.emqx.io";
    const BROKER_PORT = 8084;
    const BROKER_PATH = "/mqtt";

    let trainsData = {};
    let liveStatusMap = {};
    let currentUserRole = 'VIEWER';
    let currentSearchTab = 'ROUTE';
    let client = null;
    let deferredPrompt = null;
    let currentlyTrackedTrainId = null;

    function buildCleanTrainsDatabase() {
      const base = window.DEFAULT_TRAINS_DATA || {};
      const result = {};
      Object.keys(base).forEach(k => {
        const t = base[k];
        result[k] = {
          number: t.number,
          type: t.type || '',
          name: t.name || '',
          status: { state: 'NOT_STARTED', stationIndex: null, updatedBy: 'جدول الرحلة الأساسي', departedAt: null },
          stations: t.stations.map(st => ({
            name: st.name,
            scheduled: st.scheduled,
            actual: '--'
          }))
        };
      });
      return result;
    }

    trainsData = buildCleanTrainsDatabase();

    const cachedLive = localStorage.getItem('local_live_status_cache');
    if (cachedLive) {
      try {
        liveStatusMap = JSON.parse(cachedLive);
        applyAllLiveUpdates();
      } catch(e){}
    }

    function applyAllLiveUpdates() {
      Object.keys(liveStatusMap).forEach(trainId => {
        if (trainsData[trainId]) {
          const live = liveStatusMap[trainId];
          if (live.status) trainsData[trainId].status = live.status;
          if (live.stationsActuals && Array.isArray(live.stationsActuals)) {
            live.stationsActuals.forEach((item, idx) => {
              if (trainsData[trainId].stations[idx]) {
                if (item.actual) trainsData[trainId].stations[idx].actual = item.actual;
                if (item.delayMinutes !== undefined) trainsData[trainId].stations[idx].delayMinutes = item.delayMinutes;
              }
            });
          }
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registered!'))
          .catch((err) => console.log('SW registration error:', err));
      });
    }

    const isAppInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    const installBar = document.getElementById('installAppPrompt');
    const installBarBtn = document.getElementById('installBarBtn');
    const installBarText = document.getElementById('installBarText');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBar && !isAppInstalled) {
        installBar.style.display = 'flex';
      }
    });

    if (isIOS && !isAppInstalled && installBar) {
      installBar.style.display = 'flex';
      installBarText.textContent = "📲 أضف التطبيق لشاشة الآيفون";
      installBarBtn.textContent = "طريقة الإضافة ℹ️";
    }

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBar.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else if (isIOS) {
        showCustomAlert(
          'info',
          'إضافة التطبيق للآيفون 📲',
          'خطوات التثبيت السريعة:\n\n' +

    function formatDuration(totalMins) {
      const mins = Math.abs(Math.round(totalMins));
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return `${m} د`;
      if (m === 0) return `${h} س`;
      return `${h} س و ${m} د`;
    }

    function formatDelayBadge(delayVal) {
      if (delayVal === null || delayVal === undefined) return '';
      if (delayVal > 0) {
        return `<span class="delay-badge-red">⏱️ تأخير: +${formatDuration(delayVal)}</span>`;
      } else if (delayVal < 0) {
        return `<span class="delay-badge-early">⚡ متقدم: ${formatDuration(Math.abs(delayVal))}</span>`;
      } else {
        return '';
      }
    }

    function normalizeTimeDigits(str) {
      if (!str) return '';
      return String(str)
        .replace(/[٠۰]/g, '0').replace(/[١۱]/g, '1').replace(/[٢۲]/g, '2')
        .replace(/[٣۳]/g, '3').replace(/[٤۴]/g, '4').replace(/[٥۵]/g, '5')
        .replace(/[٦۶]/g, '6').replace(/[٧۷]/g, '7').replace(/[٨۸]/g, '8')
        .replace(/[٩۹]/g, '9');
    }

    function formatCurrentTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const period = hours >= 12 ? 'م' : 'ص';
      hours = hours % 12;
      if (hours === 0) hours = 12;
      return `${String(hours).padStart(2, '0')}:${minutes} ${period}`;
    }

    function timeStringToMinutes(str) {
      if (!str || str === '--') return null;
      let clean = normalizeTimeDigits(str).trim();
      const isPM = clean.includes('م') || /pm/i.test(clean);
      const isAM = clean.includes('ص') || /am/i.test(clean);
      
      const match = clean.match(/(\d{1,2})\s*:\s*(\d{2})/);
      if (!match) return null;

      let h = parseInt(match[1], 10);
      let m = parseInt(match[2], 10);
      if (isNaN(h) || isNaN(m)) return null;

      if (isPM && h < 12) h += 12;
      if (isAM && h === 12) h = 0;
      return h * 60 + m;
    }

    function calculateDelayMinutes(schedStr, actStr) {
      const sched = timeStringToMinutes(schedStr);
      const act = timeStringToMinutes(actStr);
      if (sched === null || act === null) return null;

      let diff = act - sched;
      if (diff < -720) diff += 1440;
      else if (diff > 720) diff -= 1440;
      return diff;
    }

    function getStationDelay(st) {
      if (st.delayMinutes !== undefined && st.delayMinutes !== null) {
        return st.delayMinutes;
      }
      if (st.scheduled && st.actual && st.actual !== '--') {
        const d = calculateDelayMinutes(st.scheduled, st.actual);
        if (d !== null) {
          st.delayMinutes = d;
          return d;
        }
      }
      return null;
    }

    function getTrainPropagatedDelay(train, targetStationIndex) {
      if (!train || !train.stations) return 0;
      if (targetStationIndex !== undefined && targetStationIndex !== null) {
        const targetSt = train.stations[targetStationIndex];
        if (targetSt) {
          const directDelay = getStationDelay(targetSt);
          if (directDelay !== null && directDelay !== undefined) return directDelay;
        }
      }

      const curIdx = (train.status && train.status.stationIndex !== null && train.status.stationIndex !== undefined) 
                     ? train.status.stationIndex 
                     : -1;

      const searchStart = (curIdx >= 0) ? curIdx : train.stations.length - 1;
      for (let i = searchStart; i >= 0; i--) {
        const st = train.stations[i];
        if (st) {
          const d = getStationDelay(st);
          if (d !== null && d !== undefined) return d;
        }
      }
      return 0;
    }

    function hasLiveUpdate(train) {
      if (!train || !train.status) return false;
      if (train.status.state === 'NOT_STARTED') return false;
      const hasAnyActual = train.stations.some(s => s.actual && s.actual !== '--');
      const isLiveState = (train.status.state === 'MOVING' || train.status.state === 'STOPPED_BETWEEN' || train.status.departedAt);
      const isUpdatedByHuman = train.status.updatedBy && !train.status.updatedBy.includes('جدول') && !train.status.updatedBy.includes('الأساسي');
      return Boolean(hasAnyActual || isLiveState || isUpdatedByHuman);
    }

    function autoResetIfNewTrip(trainId, stationIndex) {
      const train = trainsData[trainId];
      if (!train) return;
      if (stationIndex === 0) {
        let hasLaterActuals = train.stations.slice(1).some(s => s.actual && s.actual !== '--');
        if (hasLaterActuals) {
          train.stations.forEach((st, idx) => {
            if (idx > 0) {
              st.actual = '--';
              delete st.delayMinutes;
            }
          });
        }
      }
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = Math.PI / 180;
      const dLon = (lon2 - lon1) * toRad;
      const y = Math.sin(dLon) * Math.cos(lat2 * toRad);
      const x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) -
                Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function getTrackMetrics(pLat, pLng, aLat, aLng, bLat, bLng) {
      const latMid = (aLat + bLat) / 2;
      const kx = 111.0 * Math.cos(latMid * Math.PI / 180);
      const ky = 111.0;

      const ax = aLng * kx, ay = aLat * ky;
      const bx = bLng * kx, by = bLat * ky;
      const px = pLng * kx, py = pLat * ky;

      const dx = bx - ax;
      const dy = by - ay;
      const segLenSq = dx * dx + dy * dy;

      if (segLenSq === 0) {
        return { t: 0, perpDistMeters: calculateDistanceKm(pLat, pLng, aLat, aLng) * 1000 };
      }

      const t = ((px - ax) * dx + (py - ay) * dy) / segLenSq;
      const tClamped = Math.max(0, Math.min(1, t));
      const closestX = ax + tClamped * dx;
      const closestY = ay + tClamped * dy;
      const perpDistMeters = Math.sqrt((px - closestX)**2 + (py - closestY)**2) * 1000;

      return { t: t, perpDistMeters: perpDistMeters };
    }

    function normalizeStationName(name) {
      if (!name) return '';
      return String(name)
        .replace(/محطة/g, '')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getStationCoordinates(name) {
      const cleanName = normalizeStationName(name);
      for (const [key, coords] of Object.entries(EGYPT_STATIONS_COORDS)) {
        const cleanKey = normalizeStationName(key);
        if (cleanName === cleanKey || cleanName.includes(cleanKey) || cleanKey.includes(cleanName)) {
          return coords;
        }
      }
      return null;
    }

    function initMQTT() {
      const box = document.getElementById('connStatus');
      box.className = 'status-alert status-wait';
      box.textContent = "⏳ جاري الاتصال بالسيرفر اللحظي...";

      const clientId = "pass_" + Math.random().toString(16).substr(2, 8);
      client = new Paho.MQTT.Client(BROKER_HOST, Number(BROKER_PORT), BROKER_PATH, clientId);

      client.onConnectionLost = () => {
        box.className = 'status-alert status-wait';
        box.textContent = "⏳ انقطع الاتصال، جاري إعادة المحاولة...";
        setTimeout(initMQTT, 2000);
      };

      client.onMessageArrived = (message) => {
        try {
          const liveData = JSON.parse(message.payloadString);
          if (liveData && typeof liveData === 'object') {
            liveStatusMap = liveData;
            localStorage.setItem('local_live_status_cache', JSON.stringify(liveStatusMap));
            applyAllLiveUpdates();
            initAllComboboxes();
            if (currentSearchTab === 'ROUTE') {
              findClosestTrains();
            }
            if (currentlyTrackedTrainId && trainsData[currentlyTrackedTrainId]) {
              loadSelectedTrain(currentlyTrackedTrainId);
            }
          }
        } catch (e) {}
      };

      client.connect({
        useSSL: true, timeout: 5, cleanSession: true,
        onSuccess: () => {
          box.className = 'status-alert status-ok';
          box.textContent = "✅ متصل بالسيرفر اللحظي مباشرة";
          client.subscribe(LIVE_STATUS_TOPIC, { qos: 1 });
        },
        onFailure: () => {
          box.className = 'status-alert status-wait';
          box.textContent = "⏳ تعذر الاتصال، جاري إعادة المحاولة...";
          setTimeout(initMQTT, 2500);
        }
      });
    }

    function broadcastLiveStatus() {
      localStorage.setItem('local_live_status_cache', JSON.stringify(liveStatusMap));
      if (client && client.isConnected()) {
        const message = new Paho.MQTT.Message(JSON.stringify(liveStatusMap));
        message.destinationName = LIVE_STATUS_TOPIC;
        message.retained = true;
        message.qos = 1;
        client.send(message);
      }
    }

    function setupCombobox(inputId, dropdownId, getItemsCallback, onSelectCallback) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);

      function renderItems(filterText = '', forceShowAll = false) {
        const query = normalizeStationName(filterText).toLowerCase();
        const allItems = getItemsCallback();
        
        let filtered = allItems;
        if (!forceShowAll && query) {
          filtered = allItems.filter(item => {
            const text = normalizeStationName(typeof item === 'string' ? item : item.label).toLowerCase();
            return text.includes(query);
          });
        }

        dropdown.innerHTML = '';
        if (filtered.length === 0) {
          dropdown.innerHTML = '<div class="combo-item" style="color:#94a3b8; cursor:default;">⚠️ لا توجد نتائج مطابقة</div>';
        } else {
          filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'combo-item';
            div.textContent = typeof item === 'string' ? item : item.label;
            div.onclick = (e) => {
              e.stopPropagation();
              input.value = typeof item === 'string' ? item : item.label;
              dropdown.style.display = 'none';
              onSelectCallback(item);
            };
            dropdown.appendChild(div);
          });
        }
      }

      input.onfocus = () => {
        closeAllComboboxes();
        renderItems('', true);
        dropdown.style.display = 'block';
        input.select();
      };

      input.onclick = (e) => {
        e.stopPropagation();
        closeAllComboboxes();
        renderItems('', true);
        dropdown.style.display = 'block';
      };

      input.oninput = () => {
        renderItems(input.value, false);
        dropdown.style.display = 'block';
        const allItems = getItemsCallback();
        const exact = allItems.find(item => {
          const text = typeof item === 'string' ? item : item.label;
          return normalizeStationName(text).toLowerCase() === normalizeStationName(input.value).toLowerCase();
        });
        if (exact) onSelectCallback(exact);
      };
    }

          if (norm && !stationMap.has(norm)) {

      return Array.from(stationMap.values()).sort((a,b) => a.localeCompare(b, 'ar'));

    function locateNearestStation(targetInputId = 'fromStationInput') {
      if (!navigator.geolocation) {
        showCustomAlert('info', 'تنبيه', 'يرجى تشغيل الـ GPS لتحديد موقعك بدقة.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;

          let nearestName = null;
          let minDistance = Infinity;

          if (targetInputId === 'waitingStationSelect' || targetInputId === 'passengerStationSelect') {
            const select = document.getElementById(targetInputId);
            const train = trainsData[currentlyTrackedTrainId];
            if (select && train && train.stations) {
              const availableIndices = Array.from(select.options).map(opt => parseInt(opt.value));
              train.stations.forEach((st, idx) => {
                if (!availableIndices.includes(idx)) return;
                const coords = getStationCoordinates(st.name);
                if (coords) {
                  const dist = calculateDistanceKm(userLat, userLng, coords.lat, coords.lng);
                  if (dist < minDistance) {
                    minDistance = dist;
                    nearestName = st.name.replace(/محطة/g, '').trim();
                    select.value = idx;
                  }
                }
              });
            }
          }

          if (!nearestName) {
            Object.keys(EGYPT_STATIONS_COORDS).forEach(stName => {
              const coords = EGYPT_STATIONS_COORDS[stName];
              const dist = calculateDistanceKm(userLat, userLng, coords.lat, coords.lng);
              if (dist < minDistance) {
                minDistance = dist;
                nearestName = stName;
              }
            });

            if (targetInputId === 'fromStationInput') {
              const fromInput = document.getElementById('fromStationInput');
              fromInput.value = nearestName;
              findClosestTrains();
            }
          }

          if (nearestName) {
            const distKm = (minDistance).toFixed(1);
            const distMeters = Math.round(minDistance * 1000);
            showCustomAlert(
              'success',
              'تم تحديد موقعك بنجاح',
              `أقرب محطة إليك هي (${nearestName})\nوتبعد عنك حوالي ${distKm} كم (${distMeters.toLocaleString('ar-EG')} متراً).`
            );
          }
        },
        () => {
          showCustomAlert('info', 'إذن الموقع', 'يرجى السماح بالوصول لموقعك بالـ GPS لتحديد المحطة تلقائياً.');
        },
        { enableHighAccuracy: true, timeout: 7000 }
      );
    }

    function findClosestTrains() {
      const fromSt = document.getElementById('fromStationInput').value.trim();
      const toSt = document.getElementById('toStationInput').value.trim();
      const resultBox = document.getElementById('closestResultContainer');

      if (!fromSt || !toSt) {
        resultBox.style.display = 'none';
        return;
      }

      if (normalizeStationName(fromSt) === normalizeStationName(toSt)) {
        resultBox.style.display = 'block';
        resultBox.innerHTML = `<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center;">⚠️ لا يمكن اختيار نفس النقطة للقيام والوصول! اضغط على زر التبديل لتغيير الوجهة.</div>`;
        return;
      }

      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();
      let availableList = [];

      Object.keys(trainsData).forEach(trainId => {
        const train = trainsData[trainId];
        const fromIdx = train.stations.findIndex(s => normalizeStationName(s.name) === normalizeStationName(fromSt));
        const toIdx = train.stations.findIndex(s => normalizeStationName(s.name) === normalizeStationName(toSt));

        if (fromIdx !== -1 && toIdx !== -1 && fromIdx < toIdx) {
          const isLive = hasLiveUpdate(train);
          const depStation = train.stations[fromIdx];
          const arrStation = train.stations[toIdx];
          const schedMins = timeStringToMinutes(depStation.scheduled);

          if (schedMins !== null) {
            const delay = isLive ? getTrainPropagatedDelay(train, fromIdx) : 0;
            const curTrainIdx = isLive ? train.status.stationIndex : -1;

            let hasPassed = false;
            let isAtPlatformNow = false;

            if (isLive) {
              if (curTrainIdx > fromIdx) {
                hasPassed = true;
              } else if (curTrainIdx === fromIdx) {
                if (train.status.state === 'MOVING' || train.status.state === 'STOPPED_BETWEEN') {
                  hasPassed = true;
                } else if (train.status.state === 'AT_STATION') {
                  isAtPlatformNow = true;
                }
              }
            }

            let diffFromNow = schedMins - currentMins;
            let sortKey = diffFromNow;

            if ((isLive && hasPassed) || sortKey < -10) {
              sortKey += 1440;
            }

            let tripDuration = '';
            const arrSched = timeStringToMinutes(arrStation.scheduled);
            if (arrSched !== null) {
              let durationMins = arrSched - schedMins;
              if (durationMins < 0) durationMins += 1440;
              tripDuration = formatDuration(durationMins);
            }

            availableList.push({
              trainId: trainId,
              train: train,
              fromStation: depStation,
              schedMins: schedMins,
              sortKey: sortKey,
              delay: delay,
              tripDuration: tripDuration,
              hasPassed: hasPassed,
              isAtPlatformNow: isAtPlatformNow,
              isLive: isLive
            });
          }
        }
      });

      availableList.sort((a, b) => a.sortKey - b.sortKey);

      if (availableList.length === 0) {
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
          <div style="background: rgba(234, 179, 8, 0.15); border: 1px dashed #eab308; color: #facc15; padding: 12px; border-radius: 10px; font-size: 12px; text-align: center;">
            ⚠️ لا توجد قطارات مسجلة بين [${fromSt}] و [${toSt}] حالياً.
          </div>`;
        return;
      }

      resultBox.style.display = 'flex';
      resultBox.innerHTML = '';

      availableList.forEach((item, index) => {
        const isNextUpcoming = (index === 0 && !item.hasPassed);
        const card = document.createElement('div');
        card.className = `available-train-card ${item.hasPassed ? 'departed-card' : ''} ${isNextUpcoming ? 'first-train' : ''}`;

        let countdownHtml = '';
        if (item.isLive && item.hasPassed) {
          countdownHtml = `<span class="card-time-departed">⚠️ غادر المحطة</span>`;
        } else if (item.isLive && item.isAtPlatformNow) {
          countdownHtml = `<span class="card-time-remaining" style="color:#38bdf8; font-weight:800;">🛑 متوقف على الرصيف الآن</span>`;
        } else {
          let rawDiff = item.schedMins - currentMins;
          if (rawDiff >= -10 && rawDiff <= 0) {
            countdownHtml = `<span class="card-time-remaining" style="color:#facc15;">⚡ موعد قيامه الآن</span>`;
          } else {
            if (rawDiff < -10) {
              rawDiff += 1440;
            }
            countdownHtml = `<span class="card-time-remaining">⏳ باقي ${formatDuration(rawDiff)}</span>`;
          }
        }

        const cleanFromStation = item.fromStation.name.replace(/محطة/g, '').trim();
        const timeSchedHtml = `
          <div class="card-time-sched-soft">
            <span>🕒</span>
            <span>${cleanFromStation}:</span>
            <b>${item.fromStation.scheduled}</b>
          </div>
        `;

        let delayTag = '';
        if (item.isLive) {
          if (item.delay > 0) {
            delayTag = `<span style="color:#ef4444; font-weight:bold;">⏱️ تأخير: +${formatDuration(item.delay)}</span>`;
          } else if (item.delay < 0) {
            delayTag = `<span style="color:#4ade80; font-weight:bold;">⚡ متقدم: ${formatDuration(Math.abs(item.delay))}</span>`;
          } else {
            delayTag = `<span style="color:#38bdf8; font-weight:bold;">🟢 في الموعد</span>`;
          }
        }

        let locationHtml = '';
        if (item.isLive) {
          const rawCur = item.train.stations[item.train.status.stationIndex]?.name || '';
          const rawNext = item.train.stations[item.train.status.stationIndex + 1]?.name || '';
          const cleanCur = rawCur.replace(/محطة/g, '').trim();
          const cleanNext = rawNext.replace(/محطة/g, '').trim();

          let stateText = '';
          if (item.train.status.state === 'MOVING') {
            stateText = `🚀 متحرك من ${cleanCur} إلى ${cleanNext}`;
          } else if (item.train.status.state === 'STOPPED_BETWEEN') {
            stateText = `⚠️ متوقف بين ${cleanCur} و ${cleanNext}`;
          } else {
            stateText = `🛑 متوقف برصيف ${cleanCur}`;
          }
          locationHtml = `<span>📍 ${stateText}</span>`;
        }

        const typeHtml = item.train.type ? `<span class="train-type-pill">${item.train.type}</span>` : '';

        card.innerHTML = `
          <div class="card-top-row">
            <div class="card-train-identity">
              <span class="card-train-num">قطار ${item.train.number}</span>
              ${typeHtml}
              <span class="card-train-name">${item.train.name}</span>
            </div>
            <button class="btn-track-small" onclick="selectTrainDirectly('${item.trainId}')">تتبع</button>
          </div>

          <div class="card-middle-row">
            ${timeSchedHtml}
            ${countdownHtml}
          </div>

          <div class="card-bottom-row">
            ${locationHtml}
            ${delayTag ? `<span>${delayTag}</span>` : ''}
            ${item.tripDuration ? `<span>⏱️ مدة الرحلة: ${item.tripDuration}</span>` : ''}
          </div>
        `;
        resultBox.appendChild(card);
      });
    }

    function selectTrainDirectly(trainId) {
      currentlyTrackedTrainId = trainId;
      const train = trainsData[trainId];
      if (train) {
        const typeStr = train.type ? ` [${train.type}]` : '';
        document.getElementById('directTrainInput').value = `قطار ${train.number}${typeStr} - ${train.name}`;
      }
      loadSelectedTrain(trainId);
      const mapSection = document.getElementById('trainBadgeSection');
      if (mapSection) mapSection.scrollIntoView({ behavior: 'smooth' });
    }

    function loadSelectedTrain(explicitTrainId) {
      const trainId = explicitTrainId || currentlyTrackedTrainId;
      currentlyTrackedTrainId = trainId;

      const roleSec = document.getElementById('roleCardSection');
      const badgeSec = document.getElementById('trainBadgeSection');

      if (!trainId || !trainsData[trainId]) {
        resetTrackedTrainUI();
        return;
      }

      const train = trainsData[trainId];

      roleSec.style.display = 'block';
      badgeSec.style.display = 'flex';

      document.getElementById('trainTitle').textContent = `قطار ${train.number}`;
      
      const typeBadge = document.getElementById('trainTypeBadge');
      if (train.type) {
        typeBadge.textContent = train.type;
        typeBadge.style.display = 'inline-block';
      } else {
        typeBadge.style.display = 'none';
      }

      document.getElementById('trainRouteName').textContent = train.name;

      const badge = document.getElementById('statusBadge');
      const sourceBox = document.getElementById('updateSourceText');

      if (!hasLiveUpdate(train)) {
        badge.className = 'status-badge';
        badge.style.background = 'rgba(148, 163, 184, 0.15)';
        badge.style.color = '#94a3b8';
        badge.textContent = 'بانتظار بدء الرحلة';
        sourceBox.textContent = "";
      } else {
        badge.style.background = '';
        badge.style.color = '';
        const curIdx = train.status.stationIndex;
        const curStation = (train.stations[curIdx]?.name || '').replace(/محطة/g, '').trim();
        const nextStation = (train.stations[curIdx + 1]?.name || '').replace(/محطة/g, '').trim();

        if (train.status.state === 'MOVING') {
          badge.className = 'status-badge status-moving';
          badge.textContent = `متحرك من ${curStation} إلى ${nextStation}`;
        } else if (train.status.state === 'STOPPED_BETWEEN') {
          badge.className = 'status-badge status-between';
          badge.textContent = `⚠️ متوقف بين ${curStation} و ${nextStation}`;
        } else {
          badge.className = 'status-badge status-stopped';
          badge.textContent = `متوقف برصيف ${curStation}`;
        }
        sourceBox.textContent = train.status.updatedBy ? `📍 المصدر: ${train.status.updatedBy}` : "";
      }

      renderMap(train);
      renderCrowdControls();
    }

      controls.innerHTML = '';

          train.stations.forEach((st, idx) => {
            const cleanName = st.name.replace(/محطة/g, '').trim();

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label style="font-size:12px; color:#cbd5e1; font-weight:600;">المحطة التي تتواجد بها حالياً:</label>
              <button type="button" class="btn-gps-locate" onclick="locateNearestStation('passengerStationSelect')">📍 موقعي</button>
            </div>
            <select id="passengerStationSelect" style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; border-radius:10px; color:#f8fafc; font-size:13px; margin-bottom:10px; outline:none;">
              ${stationOptions}
            </select>
            <button class="btn-update btn-arrive" onclick="submitPassengerInitialArrival('${trainId}')">
              🛑 القطار متوقف / وصل عندي بالمحطة الآن
            </button>
            <button class="btn-update btn-depart" onclick="submitPassengerInitialDeparture('${trainId}')">
              🚀 تحركنا الآن من هذه المحطة
            </button>
          `;
          return;
        }

        const currentIndex = train.status.stationIndex;
        const currentStation = train.stations[currentIndex];
        const nextStation = train.stations[currentIndex + 1];

        const cleanCurrentName = (currentStation?.name || '').replace(/محطة/g, '').trim();
        const cleanNextName = nextStation ? (nextStation.name || '').replace(/محطة/g, '').trim() : '';

        if (train.status.state === 'AT_STATION') {
          if (nextStation) {
            controls.innerHTML = `
              <p style="font-size:12px; margin-bottom:8px; color:#cbd5e1;">القطار متوقف الآن في <b>${cleanCurrentName}</b>:</p>
              <button class="btn-update btn-depart" onclick="submitVerifiedMovement('${trainId}', ${currentIndex}, 'DEPART')">

              </button>
            `;

            controls.innerHTML = `<p style="font-size:12px; color:#4ade80;">وصل القطار إلى المحطة النهائية بحمد الله 🎉</p>`;
          }
        } else if (train.status.state === 'MOVING') {
          controls.innerHTML = `
            <p style="font-size:12px; margin-bottom:8px; color:#cbd5e1;">المسجل حالياً: في الطريق إلى <b>${cleanNextName}</b></p>
            ${nextStation ? `
            <button class="btn-update btn-arrive" onclick="submitVerifiedMovement('${trainId}', ${currentIndex + 1}, 'ARRIVE')">
              🛑 وصلنا رصيف ${cleanNextName}
            </button>` : ''}
            <button class="btn-update btn-caution" onclick="submitVerifiedMovement('${trainId}', ${currentIndex}, 'STOP_BETWEEN')">
              ⚠️ توقف القطار فجأة في السكة قبل الوصول
            </button>
          `;
        } else if (train.status.state === 'STOPPED_BETWEEN') {
          controls.innerHTML = `
            <p style="font-size:12px; margin-bottom:8px; color:#fca5a5;">القطار متوقف بالسكة بين <b>${cleanCurrentName}</b> و <b>${cleanNextName}</b>:</p>
            <button class="btn-update btn-depart" onclick="submitVerifiedMovement('${trainId}', ${currentIndex}, 'DEPART')">
              🚀 استأنف القطار المسير باتجاه ${cleanNextName}

            ${nextStation ? `
            <button class="btn-update btn-arrive" onclick="submitVerifiedMovement('${trainId}', ${currentIndex + 1}, 'ARRIVE')">
              🛑 دخلنا رصيف ${cleanNextName}
            </button>` : ''}

      } else if (currentUserRole === 'WAITING') {

            const cleanName = st.name.replace(/محطة/g, '').trim();

        controls.innerHTML = `

            <label style="font-size:12px; color:#cbd5e1; font-weight:600;">المكان الذي تنتظر على رصيفه:</label>
            <button type="button" class="btn-gps-locate" onclick="locateNearestStation('waitingStationSelect')">📍 موقعي</button>
          </div>
          <select id="waitingStationSelect" style="width:100%; padding:11px 12px; background:#0f172a !important; border:1px solid #334155 !important; border-radius:10px; color:#f8fafc !important; font-size:13.5px; margin-bottom:10px; outline:none;">
            ${optionsHtml}
          </select>
          <button class="btn-update btn-arrive" onclick="submitWaitingStationArrival('${trainId}')">
            🛑 القطار وصل الرصيف عندي الآن
          </button>
        `;
      }
    }

    function submitPassengerInitialArrival(trainId) {
      const selectedIdx = parseInt(document.getElementById('passengerStationSelect').value);
      submitVerifiedMovement(trainId, selectedIdx, 'ARRIVE');
    }

    function submitPassengerInitialDeparture(trainId) {
      const selectedIdx = parseInt(document.getElementById('passengerStationSelect').value);
      submitVerifiedMovement(trainId, selectedIdx, 'DEPART');
    }

    function submitWaitingStationArrival(trainId) {
      const selectedIdx = parseInt(document.getElementById('waitingStationSelect').value);
      submitVerifiedMovement(trainId, selectedIdx, 'ARRIVE');
    }

    function submitVerifiedMovement(trainId, targetStationIndex, actionType) {
      const train = trainsData[trainId];
      const isLive = hasLiveUpdate(train);
      const curIdx = isLive ? train.status.stationIndex : targetStationIndex;
      const curStation = train.stations[curIdx];
      const targetStation = train.stations[targetStationIndex];

      const cleanTarget = targetStation ? targetStation.name.replace(/محطة/g, '').trim() : '';
      const cleanCur = curStation ? curStation.name.replace(/محطة/g, '').trim() : '';

      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      if (actionType === 'ARRIVE') {
        if (isLive && targetStationIndex < curIdx) {
          showCustomAlert('error', 'محطة سابقة', `القطار تجاوز (${cleanTarget}) بالفعل.`);
          return;
        }

        if (isLive && targetStationIndex === curIdx && train.status.state === 'AT_STATION') {
          showCustomAlert('error', 'مسجل بالفعل', `القطار مسجل حالياً أنه متوقف برصيف (${cleanTarget}).`);
          return;
        }

        const toSchedMins = timeStringToMinutes(targetStation.scheduled);
        if (toSchedMins !== null) {
          let timeDiff = currentMins - toSchedMins;
          if (timeDiff < -720) timeDiff += 1440;
          else if (timeDiff > 720) timeDiff -= 1440;

          if (timeDiff < -30) {
            const earlyMins = Math.abs(timeDiff);
            showCustomAlert('error', 'محاولة تحديث مبكرة جداً', `متبقي أكثر من 30 دقيقة (${formatDuration(earlyMins)}) على موعد وصول (${cleanTarget}) المجدول [${targetStation.scheduled}].`);
            return;
          }
        }
      }

      if (!navigator.geolocation) {
        showCustomAlert('error', 'خدمة الـ GPS غير مدعومة', 'هاتفك أو متصفحك لا يدعم نظام تحديد الموقع الجغرافي.');
        return;
      }

      document.getElementById('gpsDistanceStatus').textContent = "📡 جاري التحقق من مسارك وموقعك...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const accuracy = position.coords.accuracy || 100;
          const userSpeed = position.coords.speed;
          const userHeading = position.coords.heading;

          if (accuracy > 400) {
            document.getElementById('gpsDistanceStatus').textContent = "❌ إشارة ضعيفة";
            showCustomAlert('error', 'إشارة موقع غير دقيقة', `دقة الـ GPS بهاتفك ضعيفة حالياً (${Math.round(accuracy)} متر)، يرجى الاقتراب من نافذة القطار.`);
            return;
          }

          if (actionType === 'ARRIVE') {
            const stCoords = getStationCoordinates(targetStation.name);
            if (!stCoords) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ غير مسجلة";
              showCustomAlert('error', 'بيانات ناقصة', `تعذر مطابقة إحداثيات (${cleanTarget}) في النظام.`);
              return;
            }

            const distanceKm = calculateDistanceKm(userLat, userLng, stCoords.lat, stCoords.lng);
            const distanceMeters = Math.round(distanceKm * 1000);
            const MAX_ALLOWED_METERS = 400;

            if (distanceMeters > MAX_ALLOWED_METERS) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ تم الرفض";
              const distKmFormatted = (distanceKm).toFixed(2);
              showCustomAlert(
                'error',
                'أنت بعيد عن رصيف المحطة',
                `موقعك الحالي يبعد ${distKmFormatted} كم (${distanceMeters.toLocaleString('ar-EG')} متراً) عن (${cleanTarget}).\nيشترط التواجد الفعلي داخل رصيف المحطة (أقل من 400 متر).`
              );
              return;
            }
          }

          if (actionType === 'DEPART' || actionType === 'STOP_BETWEEN') {
            const fromSt = train.stations[targetStationIndex];
            const toSt = train.stations[targetStationIndex + 1];

            if (!toSt) {
              showCustomAlert('error', 'نهاية الخط', 'القطار في المحطة النهائية، لا توجد محطة تالية للمسير نحوها.');
              return;
            }

            const c1 = getStationCoordinates(fromSt.name);
            const c2 = getStationCoordinates(toSt.name);

            if (!c1 || !c2) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ غير مسجلة";
              showCustomAlert('error', 'بيانات ناقصة', 'تعذر مطابقة إحداثيات خط السير في النظام.');
              return;
            }

            const cleanNextName = toSt.name.replace(/محطة/g, '').trim();
            const metrics = getTrackMetrics(userLat, userLng, c1.lat, c1.lng, c2.lat, c2.lng);

            const segmentDistKm = calculateDistanceKm(c1.lat, c1.lng, c2.lat, c2.lng);
            const MAX_PERP_METERS = Math.max(3000, segmentDistKm * 80);

            if (metrics.perpDistMeters > MAX_PERP_METERS) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ خارج المسار";
              const distMetersRounded = Math.round(metrics.perpDistMeters);
              showCustomAlert(
                'error',
                'أنت بعيد عن شريط السكة الحديد',
                `موقعك الحالي يبعد مسافة ${distMetersRounded.toLocaleString('ar-EG')} متراً عن خط سير القطار المتجه إلى (${cleanNextName}).\nيشترط التواجد الفعلي على مسار القطار.`
              );
              return;
            }

            if (actionType === 'DEPART') {
              if (userHeading !== null && !isNaN(userHeading) && userHeading >= 0 && userSpeed !== null && userSpeed > 1.8) {
                const expectedBearing = calculateBearing(c1.lat, c1.lng, c2.lat, c2.lng);
                let angleDiff = Math.abs(userHeading - expectedBearing);
                if (angleDiff > 180) angleDiff = 360 - angleDiff;

                if (angleDiff > 95) {
                  document.getElementById('gpsDistanceStatus').textContent = "❌ اتجاه خاطئ";
                  showCustomAlert(
                    'error',
                    'الاتجاه معاكس لمسار القطار',
                    `تم رصد تحركك في اتجاه معاكس لخط سير القطار المتجه إلى [${cleanNextName}]!`
                  );
                  return;
                }
              }
            }
          }

          applyTrainUpdate(trainId, targetStationIndex, actionType);
        },
        () => {
          document.getElementById('gpsDistanceStatus').textContent = "";
          showCustomAlert('error', 'إذن الموقع مطلوب', 'يرجى السماح بالوصول لموقعك الجغرافي (GPS) لتأكيد التحديث.');
        },
        { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 }
      );
    }

    function applyTrainUpdate(trainId, stationIndex, actionType) {
      autoResetIfNewTrip(trainId, stationIndex);

      const timeStr = formatCurrentTime();
      const train = trainsData[trainId];
      const cleanStation = (train.stations[stationIndex]?.name || '').replace(/محطة/g, '').trim();

      if (actionType === 'ARRIVE') {
        train.status = { 
          state: 'AT_STATION', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق بالـ GPS (${timeStr})`,
          departedAt: null
        };
        train.stations[stationIndex].actual = timeStr;

        const delay = calculateDelayMinutes(train.stations[stationIndex].scheduled, timeStr);
        if (delay !== null) {
          train.stations[stationIndex].delayMinutes = delay;
        }
      } else if (actionType === 'DEPART') {
        train.status = { 
          state: 'MOVING', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق بالـ GPS (${timeStr})`,
          departedAt: Date.now()
        };
      } else if (actionType === 'STOP_BETWEEN') {
        const nextSt = train.stations[stationIndex + 1];
        const cleanNext = nextSt ? nextSt.name.replace(/محطة/g, '').trim() : '';
        train.status = { 
          state: 'STOPPED_BETWEEN', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق: متوقف بين ${cleanStation} و ${cleanNext} (${timeStr})`
        };
      }

      liveStatusMap[trainId] = {
        status: train.status,
        stationsActuals: train.stations.map(st => ({
          actual: st.actual,
          delayMinutes: st.delayMinutes
        }))
      };

      broadcastLiveStatus();
      document.getElementById('gpsDistanceStatus').textContent = "✅ تم الاعتماد!";
      showCustomAlert('success', 'تم اعتماد موقعك بنجاح', `تم التحقق عبر الـ GPS وتحديث حالة قطار (${train.number}) سحابياً.`);
      loadSelectedTrain(trainId);
    }

    function renderMap(train) {
      const map = document.getElementById('routeMap');
      map.innerHTML = '';

      const isLive = hasLiveUpdate(train);

      train.stations.forEach((st, idx) => {
        const isStoppedHere = isLive && (train.status.state === 'AT_STATION' && train.status.stationIndex === idx);
        const delayVal = isLive ? getStationDelay(st) : null;
        const delayHtml = formatDelayBadge(delayVal);
        const scheduledText = st.scheduled ? st.scheduled : '--';
        const actualText = (isLive && st.actual && st.actual !== '--') 
          ? `<div class="time-act">✅ وصل: ${st.actual}</div>` 
          : '';

        const cleanName = st.name.replace(/محطة/g, '').trim();

        const row = document.createElement('div');
        row.className = 'station-node';
        row.innerHTML = `
          <div class="big-dot ${isStoppedHere ? 'stopped-here' : ''}"></div>
          <div class="station-details">
            <span class="station-name">${cleanName}</span>
            <div class="times-box">
              <div class="time-sched-line">
                <span class="time-sched">الموعد: <b>${scheduledText}</b></span>
                ${delayHtml}
              </div>
              ${actualText}
            </div>
          </div>
        `;
        map.appendChild(row);

        if (idx < train.stations.length - 1) {
          const isMovingHere = isLive && (train.status.state === 'MOVING' && train.status.stationIndex === idx);
          const isStoppedBetweenHere = isLive && (train.status.state === 'STOPPED_BETWEEN' && train.status.stationIndex === idx);

          let dotClass = '';
          if (isMovingHere) dotClass = 'moving-here';
          if (isStoppedBetweenHere) dotClass = 'stopped-between-here';

          const track = document.createElement('div');
          track.className = 'track-line';
          track.innerHTML = `<div class="small-dot ${dotClass}"></div>`;
          map.appendChild(track);
        }
      });
    }

    initAllComboboxes();
    initMQTT();
  </script>
</body>
