<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع القطارات - تطبيق الراكب التشاركي</title>
  
  <!-- إعدادات تحويل الموقع إلى تطبيق هاتف PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="القطارات">
  <link rel="apple-touch-icon" href="icon.svg">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #0b0f19; 
      color: #f8fafc; 
      padding: 16px; 
      display: flex; 
      justify-content: center; 
    }
    .app-container { 
      width: 100%; 
      max-width: 480px; 
      background: #1e293b; 
      border-radius: 20px; 
      padding: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
    }
    
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 21px; color: #38bdf8; margin-bottom: 4px; }
    header p { font-size: 13px; color: #94a3b8; }

    /* شريط دعوة تثبيت التطبيق على الشاشة الرئيسية */
    .install-bar {
      display: none;
      background: #132238;
      border: 1px solid #0284c7;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .install-bar span { font-size: 12.5px; color: #e2e8f0; font-weight: 600; }
    .btn-install {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-install:hover { background: #0369a1; }

    .status-alert { 
      padding: 8px 12px; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      font-size: 12px; 
      text-align: center;
      transition: all 0.3s ease;
    }
    .status-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .status-wait { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab308; }

    .selector-box { margin-bottom: 15px; }
    .selector-box label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
    select { 
      width: 100%; 
      padding: 12px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      cursor: pointer;
    }

    .role-card {
      background: #0f172a;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .role-title { font-size: 13px; color: #93c5fd; font-weight: bold; margin-bottom: 8px; text-align: center; }
    .role-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .role-btn {
      padding: 8px 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .role-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }

    .crowd-panel {
      background: #132238;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .crowd-title { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .btn-update {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-update:hover { opacity: 0.9; }
    .btn-arrive { background: #ef4444; color: white; }
    .btn-depart { background: #eab308; color: #000; }
    .btn-caution { background: #b91c1c; color: #fecaca; border: 1px solid #f87171; }

    /* بطاقة معلومات القطار الأصلية */
    .train-info-badge { 
      background: #0f172a; 
      padding: 12px; 
      border-radius: 12px; 
      border-right: 4px solid #38bdf8; 
      margin-bottom: 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .status-badge { font-size: 11px; padding: 5px 8px; border-radius: 20px; font-weight: bold; }
    .status-moving { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .status-stopped { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .status-between { background: rgba(220, 38, 38, 0.35); color: #fca5a5; border: 1px solid #ef4444; }

    .route-map { position: relative; padding: 10px 5px; }
    .station-node { display: flex; align-items: center; position: relative; margin-bottom: 6px; }
    
    .big-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: #334155; border: 3px solid #1e293b;
      position: relative; z-index: 2; transition: all 0.3s ease;
    }
    
    .big-dot.stopped-here {
      background: #ef4444 !important;
      border-color: #fca5a5;
      box-shadow: 0 0 16px 5px rgba(239, 68, 68, 0.85);
      transform: scale(1.25);
    }

    .station-details { 
      margin-right: 12px; 
      flex-grow: 1; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 8px;
    }
    .station-name { 
      font-size: 14px; 
      font-weight: 700; 
      color: #f1f5f9; 
      white-space: nowrap;
    }

    .times-box { 
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    
    .time-sched-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    
    .time-sched {
      font-size: 12px;
      color: #94a3b8;
    }
    .time-sched b {
      color: #f8fafc;
    }

    .time-act { 
      font-weight: bold; 
      color: #38bdf8; 
      font-size: 11px;
    }

    /* شارات التأخير البارزة بالأحمر */
    .delay-badge-red {
      color: #ffffff !important;
      background: #dc2626 !important;
      border: 1px solid #ef4444 !important;
      padding: 3px 8px !important;
      border-radius: 6px !important;
      font-weight: 800 !important;
      font-size: 11px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 3px !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.8) !important;
      white-space: nowrap !important;
      animation: alertPulse 1.8s infinite;
    }

    @keyframes alertPulse {
      0% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 14px rgba(239, 68, 68, 0.95); }
      100% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.5); }
    }

    .delay-badge-ontime {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #0284c7;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }
    .delay-badge-early {
      color: #4ade80;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }

    .track-line {
      width: 4px; height: 50px; background: #334155;
      margin-right: 9px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    
    .small-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #475569; position: absolute; right: -3px;
    }

    .small-dot.moving-here {
      background: #facc15;
      box-shadow: 0 0 14px 4px rgba(250, 204, 21, 0.9);
      animation: pulse 0.8s infinite alternate;
    }

    .small-dot.stopped-between-here {
      background: #ef4444;
      width: 14px; height: 14px; right: -5px;
      box-shadow: 0 0 14px 5px rgba(239, 68, 68, 0.95);
      animation: blink 0.6s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.6); opacity: 1; }
    }

    @keyframes blink {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0.3; }
    }

    /* نافذة المودال المخصصة */
    .custom-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 9, 18, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 16px;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

    .custom-modal-card {
      background: #131d2e;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      animation: modalPopUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      direction: rtl;
    }

    @keyframes modalPopUp {
      from { opacity: 0; transform: scale(0.9) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon-container {
      width: 64px; height: 64px; border-radius: 50%;
      margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
    }

    .modal-error { border: 1px solid rgba(239, 68, 68, 0.45); }
    .modal-error .modal-icon-container {
      background: rgba(239, 68, 68, 0.15); border: 2px solid #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.45);
    }
    .modal-error .modal-title { color: #f87171; font-size: 17px; font-weight: 800; margin-bottom: 10px; }
    .modal-error .modal-btn { background: #dc2626; color: #fff; }
    .modal-error .modal-btn:hover { background: #b91c1c; }

    .modal-success { border: 1px solid rgba(34, 197, 94, 0.45); }
    .modal-success .modal-icon-container {
      background: rgba(34, 197, 94, 0.15); border: 2px solid #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.45);
    }
    .modal-success .modal-title { color: #4ade80; font-size: 17px; font-weight: 800; margin-bottom: 10px; }
    .modal-success .modal-btn { background: #10b981; color: #fff; }
    .modal-success .modal-btn:hover { background: #059669; }

    .modal-message { font-size: 13.5px; line-height: 1.65; color: #cbd5e1; margin-bottom: 20px; white-space: pre-line; word-break: break-word; }
    .modal-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- نافذة التنبيهات المودال المخصصة للمستخدم -->
  <div id="customModalOverlay" class="custom-modal-overlay" style="display: none;" onclick="if(event.target===this) closeCustomModal()">
    <div class="custom-modal-card">
      <div id="modalIconContainer" class="modal-icon-container"></div>
      <h3 id="modalTitle" class="modal-title"></h3>
      <div id="modalMessage" class="modal-message"></div>
      <button id="modalBtn" class="modal-btn" onclick="closeCustomModal()">حسناً</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <h1>🚆 تتبع القطارات التشاركي</h1>
      <p>تحديث الموقع لحظياً بمساعدة ركاب القطار والـ GPS المنطقي</p>
    </header>

    <!-- شريط دعوة تثبيت التطبيق -->
    <div id="installAppPrompt" class="install-bar">
      <span>📲 ثبّت تطبيق القطارات على هاتفك</span>
      <button class="btn-install" onclick="installPWA()">تثبيت الآن</button>
    </div>

    <div id="connStatus" class="status-alert status-wait">⏳ جاري الاتصال بالسيرفر السحابي...</div>

    <div class="selector-box">
      <label>اختر رقم القطار لمتابعته:</label>
      <select id="trainSelect" onchange="loadSelectedTrain()"></select>

    <!-- بطاقة سؤال المستخدم عن دوره -->
    <div class="role-card" id="roleCardSection" style="display: none;">
      <div class="role-title">📍 هل أنت في هذا القطار أو بالمحطة الآن؟</div>
      <div class="role-buttons">
        <button class="role-btn" id="btnRolePassenger" onclick="setUserRole('PASSENGER')">🚆 أنا راكب القطار</button>
        <button class="role-btn" id="btnRoleWaiting" onclick="setUserRole('WAITING')">⏳ منتظر بمحطة</button>
        <button class="role-btn active" id="btnRoleViewer" onclick="setUserRole('VIEWER')">👁️ مجرد متابع</button>
      </div>
    </div>

    <!-- لوحة التحديث بالـ GPS للمساهمين -->
    <div class="crowd-panel" id="crowdActionPanel" style="display: none;">
      <div class="crowd-title">
        <span>مساعد المسافرين (GPS مُفعّل) 📡</span>
        <span id="gpsDistanceStatus" style="font-size: 11px; color:#facc15;"></span>
      </div>
      <div id="crowdControls"></div>
    </div>

    <!-- بطاقة معلومات القطار الأصلية -->
    <div class="train-info-badge" id="trainBadgeSection" style="display: none;">
      <div>
        <div style="font-weight: bold;" id="trainTitle">--</div>
        <div style="font-size: 12px; color: #94a3b8;" id="trainRouteName">--</div>
        <div id="updateSourceText" style="font-size: 11px; color: #64748b; margin-top: 4px;"></div>
      </div>

    </div>

    <div class="route-map" id="routeMap">
      <div style="text-align: center; color: #64748b; padding: 30px 10px;">
        👈 يرجى اختيار قطار من القائمة أعلاه لمتابعة مساره المباشر.
      </div>
    </div>
  </div>

  <script>
    const SYNC_TOPIC = "egy_train_master_sync_2026";
    const BROKER_HOST = "broker.emqx.io";
    const BROKER_PORT = 8084;
    const BROKER_PATH = "/mqtt";

    let trainsData = {};
    let currentUserRole = 'VIEWER';
    let client = null;
    let deferredPrompt = null;

    // تسجيل Service Worker لتحويل الموقع إلى تطبيق هاتف
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registered!'))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }

    // التقاط إشعار تثبيت التطبيق
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const bar = document.getElementById('installAppPrompt');
      if (bar) bar.style.display = 'flex';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            document.getElementById('installAppPrompt').style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    function showCustomAlert(type, title, message) {
      const overlay = document.getElementById('customModalOverlay');
      const card = overlay.querySelector('.custom-modal-card');
      const iconBox = document.getElementById('modalIconContainer');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMessage');
      const btnEl = document.getElementById('modalBtn');

      card.className = 'custom-modal-card ' + (type === 'success' ? 'modal-success' : 'modal-error');

      if (type === 'success') {
        iconBox.innerHTML = `
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        `;
        titleEl.textContent = title || "تم بنجاح";
        btnEl.textContent = "حسناً";
      } else {
        iconBox.innerHTML = `
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        `;
        titleEl.textContent = title || "خطأ أو تنبيه";
        btnEl.textContent = "إغلاق";
      }

      msgEl.textContent = message;
      overlay.style.display = 'flex';
    }

    function closeCustomModal() {
      document.getElementById('customModalOverlay').style.display = 'none';
    }

    function normalizeTimeDigits(str) {
      if (!str) return '';
      return String(str)
        .replace(/[٠۰]/g, '0').replace(/[١۱]/g, '1').replace(/[٢۲]/g, '2')
        .replace(/[٣۳]/g, '3').replace(/[٤۴]/g, '4').replace(/[٥۵]/g, '5')
        .replace(/[٦۶]/g, '6').replace(/[٧۷]/g, '7').replace(/[٨۸]/g, '8')
        .replace(/[٩۹]/g, '9');
    }

    function formatCurrentTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const period = hours >= 12 ? 'م' : 'ص';
      hours = hours % 12;
      if (hours === 0) hours = 12;
      const hoursStr = String(hours).padStart(2, '0');
      return `${hoursStr}:${minutes} ${period}`;
    }

    function timeStringToMinutes(str) {
      if (!str || str === '--' || str.includes('تجاوز')) return null;
      let clean = normalizeTimeDigits(str).trim();
      const isPM = clean.includes('م') || /pm/i.test(clean);
      const isAM = clean.includes('ص') || /am/i.test(clean);
      
      const match = clean.match(/(\d{1,2})\s*:\s*(\d{2})/);
      if (!match) return null;

      let h = parseInt(match[1], 10);
      let m = parseInt(match[2], 10);
      if (isNaN(h) || isNaN(m)) return null;

      if (isPM && h < 12) h += 12;
      if (isAM && h === 12) h = 0;
      return h * 60 + m;
    }

    function calculateDelayMinutes(schedStr, actStr) {
      const sched = timeStringToMinutes(schedStr);
      const act = timeStringToMinutes(actStr);
      if (sched === null || act === null) return null;

      let diff = act - sched;
      if (diff < -720) diff += 1440;
      else if (diff > 720) diff -= 1440;
      return diff;
    }

    function getStationDelay(st) {
      if (st.delayMinutes !== undefined && st.delayMinutes !== null) {
        return st.delayMinutes;
      }
      if (st.scheduled && st.actual && st.actual !== '--') {
        const d = calculateDelayMinutes(st.scheduled, st.actual);
        if (d !== null) {
          st.delayMinutes = d;
          return d;
        }
      }
      return null;
    }

    const cached = localStorage.getItem('local_trains_cache');
    if (cached) {
      try { 
        trainsData = JSON.parse(cached);
        populateTrainDropdown();
      } catch(e){}
    }

    // تصفير تلقائي ذكي عند بداية رحلة جديدة للقطار
    function autoResetIfNewTrip(trainId, stationIndex) {
      const train = trainsData[trainId];
      if (!train) return;

      if (stationIndex === 0) {
        let hasLaterActuals = train.stations.slice(1).some(s => s.actual && s.actual !== '--');
        if (hasLaterActuals) {
          train.stations.forEach((st, idx) => {
            if (idx > 0) {
              st.actual = '--';
              delete st.delayMinutes;
            }
          });
        }
      }
    }

    const EGYPT_STATIONS_COORDS = {
      "القاهرة": { lat: 30.0633, lng: 31.2469 },
      "رمسيس": { lat: 30.0633, lng: 31.2469 },

      "الحوامدية": { lat: 29.8972, lng: 31.2612 },
      "البدرشين": { lat: 29.8142, lng: 31.2657 },
      "العياط": { lat: 29.6197, lng: 31.2584 },
      "قليوب": { lat: 30.1794, lng: 31.2056 },
      "قها": { lat: 30.2844, lng: 31.2033 },
      "طوخ": { lat: 30.3547, lng: 31.1994 },
      "بنها": { lat: 30.4660, lng: 31.1853 },
      "قويسنا": { lat: 30.5186, lng: 31.1444 },
      "بركة السبع": { lat: 30.6386, lng: 31.0850 },
      "طنطا": { lat: 30.7885, lng: 31.0020 },
      "كفر الزيات": { lat: 30.8252, lng: 30.8175 },
      "التوفيقية": { lat: 30.8936, lng: 30.7303 },
      "إيتاي البارود": { lat: 30.8872, lng: 30.6658 },
      "دمنهور": { lat: 31.0409, lng: 30.4700 },

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function normalizeStationName(name) {
      return name.replace(/محطة/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim();
    }

    function getStationCoordinates(name) {
      const cleanName = normalizeStationName(name);
      for (const [key, coords] of Object.entries(EGYPT_STATIONS_COORDS)) {
        const cleanKey = normalizeStationName(key);
        if (cleanName.includes(cleanKey) || cleanKey.includes(cleanName)) {
          return coords;
        }
      }
      return null;
    }

    function initMQTT() {
      const box = document.getElementById('connStatus');
      box.className = 'status-alert status-wait';
      box.textContent = "⏳ جاري الاتصال بالسيرفر السحابي...";

      const clientId = "pass_" + Math.random().toString(16).substr(2, 8);
      client = new Paho.MQTT.Client(BROKER_HOST, Number(BROKER_PORT), BROKER_PATH, clientId);

      client.onConnectionLost = () => {
        box.className = 'status-alert status-wait';
        box.textContent = "⏳ انقطع الاتصال، جاري إعادة المحاولة...";
        setTimeout(initMQTT, 2000);
      };

      client.onMessageArrived = (message) => {
        try {
          const data = JSON.parse(message.payloadString);
          if (data && typeof data === 'object') {
            trainsData = data;
            localStorage.setItem('local_trains_cache', JSON.stringify(trainsData));
            populateTrainDropdown();
          }
        } catch (e) {}
      };

      client.connect({
        useSSL: true,
        timeout: 5,
        cleanSession: true,
        onSuccess: () => {
          box.className = 'status-alert status-ok';
          box.textContent = "✅ متصل بالسيرفر السحابي مباشرة";
          client.subscribe(SYNC_TOPIC, { qos: 1 });
        },
        onFailure: () => {
          box.className = 'status-alert status-wait';
          box.textContent = "⏳ تعذر الاتصال، جاري إعادة المحاولة...";
          setTimeout(initMQTT, 2500);
        }
      });
    }

    function broadcastData() {
      localStorage.setItem('local_trains_cache', JSON.stringify(trainsData));
      if (client && client.isConnected()) {
        const message = new Paho.MQTT.Message(JSON.stringify(trainsData));
        message.destinationName = SYNC_TOPIC;
        message.retained = true;
        message.qos = 1;
        client.send(message);
      }
    }

      currentUserRole = role;

    function populateTrainDropdown() {
      const select = document.getElementById('trainSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">-- اختر رقم القطار لمتابعته --</option>';
      
      const keys = Object.keys(trainsData);
      keys.forEach(key => {
        const t = trainsData[key];
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = `قطار ${t.number} - ${t.name}`;
        select.appendChild(opt);
      });

      if (currentVal && trainsData[currentVal]) {
        select.value = currentVal;
      }
      loadSelectedTrain();
    }

    function loadSelectedTrain() {
      const trainId = document.getElementById('trainSelect').value;
      const train = trainsData[trainId];

      const roleSec = document.getElementById('roleCardSection');
      const badgeSec = document.getElementById('trainBadgeSection');
      const crowdSec = document.getElementById('crowdActionPanel');
      const routeMap = document.getElementById('routeMap');

      if (!trainId || !train) {
        roleSec.style.display = 'none';
        badgeSec.style.display = 'none';
        crowdSec.style.display = 'none';
        routeMap.innerHTML = '<div style="text-align: center; color: #64748b; padding: 30px 10px;">👈 يرجى اختيار قطار من القائمة أعلاه لمتابعة مساره المباشر.</div>';
        return;
      }

      roleSec.style.display = 'block';
      badgeSec.style.display = 'flex';

      document.getElementById('trainTitle').textContent = `قطار رقم ${train.number}`;
      document.getElementById('trainRouteName').textContent = train.name;

      const badge = document.getElementById('statusBadge');
      const curIdx = train.status.stationIndex;
      const curStation = train.stations[curIdx]?.name || '';
      const nextStation = train.stations[curIdx + 1]?.name || '';

      if (train.status.state === 'MOVING') {
        badge.className = 'status-badge status-moving';
        badge.textContent = `متحرك: ${curStation} ⟵ ${nextStation}`;
      } else if (train.status.state === 'STOPPED_BETWEEN') {
        badge.className = 'status-badge status-between';
        badge.textContent = `⚠️ متوقف بالسكة بين ${curStation} و ${nextStation}`;
      } else {
        badge.className = 'status-badge status-stopped';
        badge.textContent = `متوقف برصيف محطة ${curStation}`;
      }

      const sourceBox = document.getElementById('updateSourceText');
      sourceBox.textContent = train.status.updatedBy ? `📍 المصدر: ${train.status.updatedBy}` : "";

      renderMap(train);
      renderCrowdControls();

    // التحقق المنطقي والجغرافي الكامل بالمتر وبمسار السكة الحديد
    function submitVerifiedMovement(trainId, targetStationIndex, actionType) {
      const train = trainsData[trainId];
      const curIdx = train.status.stationIndex;
      const curStation = train.stations[curIdx];
      const targetStation = train.stations[targetStationIndex];

      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      // 1. فحص الاتجاه: منع التحديث للخلف
      if (actionType === 'ARRIVE') {
        if (targetStationIndex < curIdx) {
          showCustomAlert('error', 'محطة سابقة', `القطار تجاوز محطة (${targetStation.name}) بالفعل، لا يمكن التحديث للخلف.`);
          return;
        }

        if (targetStationIndex === curIdx && train.status.state === 'AT_STATION') {
          showCustomAlert('error', 'مسجل بالفعل', `القطار مسجل حالياً أنه متوقف برصيف محطة (${targetStation.name}).`);
          return;
        }

        // 2. التحقق من الوقت المجدول (منع الوصول المبكر > 15 دقيقة أو المتأخر > ساعتين)
        const toSchedMins = timeStringToMinutes(targetStation.scheduled);
        if (toSchedMins !== null) {
          let timeDiff = currentMins - toSchedMins;
          if (timeDiff < -720) timeDiff += 1440;
          else if (timeDiff > 720) timeDiff -= 1440;

          if (timeDiff < -15) {
            showCustomAlert('error', 'محاولة تحديث مبكرة', `متبقي أكثر من 15 دقيقة على موعد وصول محطة (${targetStation.name}) المجدول [${targetStation.scheduled}]. لا يمكن تسجيل الوصول الآن.`);
            return;
          }

          if (timeDiff > 120) {
            showCustomAlert('error', 'تأخير كبير جداً', `القطار متأخر بأكثر من ساعتين عن موعده المجدول، يرجى اعتماد التحديث من المشرف.`);
            return;
          }
        }

        // 3. فحص واقعية سرعة القطار
        if (train.status.departedAt || (curStation.actual && curStation.actual !== '--')) {
          let elapsedMinutes = null;

          if (train.status.departedAt) {
            elapsedMinutes = (Date.now() - train.status.departedAt) / 60000;
          } else if (curStation.actual) {
            const lastActMins = timeStringToMinutes(curStation.actual);
            if (lastActMins !== null) {
              let diff = currentMins - lastActMins;
              if (diff < -720) diff += 1440;
              else if (diff > 720) diff -= 1440;
              elapsedMinutes = diff;
            }
          }

          const fromSchedMins = timeStringToMinutes(curStation.scheduled);
          if (elapsedMinutes !== null && fromSchedMins !== null && toSchedMins !== null) {
            let scheduledTripDuration = toSchedMins - fromSchedMins;
            if (scheduledTripDuration < 0) scheduledTripDuration += 1440;

            const minRealisticMinutes = Math.max(2, scheduledTripDuration * 0.35);

            if (elapsedMinutes >= 0 && elapsedMinutes < minRealisticMinutes) {
              showCustomAlert('error', 'سرعة غير منطقية', `تحرك القطار منذ (${Math.round(elapsedMinutes)} د) فقط، يستحيل وصوله للمحطة التالية بهذه السرعة.`);
              return;
            }
          }
        }
      }

      if (!navigator.geolocation) {
        showCustomAlert('error', 'خدمة الـ GPS غير مدعومة', 'هاتفك أو متصفحك لا يدعم نظام تحديد الموقع الجغرافي.');
        return;
      }

      document.getElementById('gpsDistanceStatus').textContent = "📡 جاري التحقق من موقعك...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const accuracy = position.coords.accuracy || 100;

          if (accuracy > 1500) {
            document.getElementById('gpsDistanceStatus').textContent = "❌ إشارة ضعيفة";
            showCustomAlert('error', 'إشارة GPS ضعيفة', 'إشارة الموقع على هاتفك غير دقيقة حالياً، يرجى الاقتراب من نافذة القطار أو مكان مفتوح.');
            return;
          }

          // فحص مسافة الوصول بالمتر بدقة (350م للمنتظر و450م للراكب)
          if (actionType === 'ARRIVE') {
            const stCoords = getStationCoordinates(targetStation.name);
            if (!stCoords) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ غير مسجلة";
              showCustomAlert('error', 'محطة غير مسجلة', `تعذر مطابقة إحداثيات محطة (${targetStation.name}) في النظام.`);
              return;
            }

            const distanceKm = calculateDistanceKm(userLat, userLng, stCoords.lat, stCoords.lng);
            const distanceMeters = Math.round(distanceKm * 1000);
            const MAX_ALLOWED_METERS = (currentUserRole === 'WAITING') ? 350 : 450;

            if (distanceMeters > MAX_ALLOWED_METERS) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ تم الرفض";
              const roleText = (currentUserRole === 'WAITING') ? 'الرصيف' : 'المحطة';
              showCustomAlert('error', 'الموقع بعيد عن المحطة', `أنت تبعد مسافة (${distanceMeters} متراً) عن محطة (${targetStation.name}).\nيجب أن تكون على ${roleText} بالفعل لتأكيد الوصول (المسموح حتى ${MAX_ALLOWED_METERS} متر).`);
              return;
            }
          }

          // فحص التحرك والمغادرة الذكي (سواء عند رصيف المحطة أو في منتصف الطريق)
          if (actionType === 'DEPART') {
            const fromCoords = getStationCoordinates(curStation.name);
            const toSt = train.stations[curIdx + 1];
            const toCoords = toSt ? getStationCoordinates(toSt.name) : null;

            if (!fromCoords || !toCoords) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ غير مسجلة";
              showCustomAlert('error', 'محطة غير مسجلة', `تعذر مطابقة إحداثيات محطات المسار في النظام.`);
              return;
            }

            const dFrom = calculateDistanceKm(userLat, userLng, fromCoords.lat, fromCoords.lng);
            const dTo = calculateDistanceKm(userLat, userLng, toCoords.lat, toCoords.lng);
            const totalBetween = calculateDistanceKm(fromCoords.lat, fromCoords.lng, toCoords.lat, toCoords.lng);

            // الحالة الأولى: الراكب ما زال عند محطة المغادرة (أقل من 800 متر)
            const isNearDeparture = (dFrom * 1000 <= 800);

            // الحالة الثانية: القطار في منتصف الطريق على شريط السكة الحديد بين المحطتين
            const isOnTrackBetween = (dFrom + dTo <= totalBetween + 4.0);

            if (!isNearDeparture && !isOnTrackBetween) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ خارج المسار";
              showCustomAlert('error', 'لست على مسار القطار', `أنت لا تتواجد بمحطة المغادرة (${curStation.name}) ولا على مسار السكة الحديد المتجه إلى (${toSt.name}).`);
              return;
            }
          }

          // فحص التوقف الفجائي بين المحطات
          if (actionType === 'STOP_BETWEEN') {
            const fromSt = train.stations[train.status.stationIndex];
            const toSt = train.stations[train.status.stationIndex + 1];
            const c1 = getStationCoordinates(fromSt.name);
            const c2 = toSt ? getStationCoordinates(toSt.name) : null;

            if (!c1 || !c2) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ محطة غير مسجلة";
              showCustomAlert('error', 'بيانات ناقصة', 'تعذر مطابقة إحداثيات المحطات المحيطة بموقعك.');
              return;
            }

            const d1 = calculateDistanceKm(userLat, userLng, c1.lat, c1.lng);
            const d2 = calculateDistanceKm(userLat, userLng, c2.lat, c2.lng);
            const interDistance = calculateDistanceKm(c1.lat, c1.lng, c2.lat, c2.lng);

            if (d1 + d2 > interDistance + 5.0) {
              document.getElementById('gpsDistanceStatus').textContent = "❌ بعيد عن المسار";
              showCustomAlert('error', 'خارج مسار السكة الحديد', 'أنت تتواجد في مكان بعيد عن خط سير القطار.');
              return;
            }
          }

          applyTrainUpdate(trainId, targetStationIndex, actionType);
        },
        (error) => {
          document.getElementById('gpsDistanceStatus').textContent = "";
          showCustomAlert('error', 'إذن الموقع مطلوب', 'يرجى السماح بالوصول لموقعك الجغرافي (GPS) لتأكيد التحديث.');
        },
        { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 }
      );
    }

    function applyTrainUpdate(trainId, stationIndex, actionType) {
      autoResetIfNewTrip(trainId, stationIndex);

      const timeStr = formatCurrentTime();
      const train = trainsData[trainId];

      if (actionType === 'ARRIVE') {
        train.status = { 
          state: 'AT_STATION', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق بالـ GPS (${timeStr})`,
          departedAt: null
        };
        train.stations[stationIndex].actual = timeStr;

        const delay = calculateDelayMinutes(train.stations[stationIndex].scheduled, timeStr);
        if (delay !== null) {
          train.stations[stationIndex].delayMinutes = delay;
        }
      } else if (actionType === 'DEPART') {
        train.status = { 
          state: 'MOVING', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق بالـ GPS (${timeStr})`,
          departedAt: Date.now()
        };
      } else if (actionType === 'STOP_BETWEEN') {
        train.status = { 
          state: 'STOPPED_BETWEEN', 
          stationIndex: stationIndex,
          updatedBy: `تحديث موثق: متوقف بالسكة (${timeStr})`
        };
      }

      broadcastData();
      document.getElementById('gpsDistanceStatus').textContent = "✅ تم الاعتماد!";
      showCustomAlert('success', 'تم اعتماد موقعك بنجاح', `تم التحقق عبر الـ GPS وتحديث حالة قطار (${train.number}) سحابياً.`);
      loadSelectedTrain();
    }

    function renderMap(train) {
      const map = document.getElementById('routeMap');
      map.innerHTML = '';

      train.stations.forEach((st, idx) => {
        const isStoppedHere = (train.status.state === 'AT_STATION' && train.status.stationIndex === idx);

        const delayVal = getStationDelay(st);
        let delayHtml = '';
        if (delayVal !== null) {
          if (delayVal > 0) {
            delayHtml = `<span class="delay-badge-red">⏱️ تأخير: +${delayVal} د</span>`;
          } else if (delayVal < 0) {
            delayHtml = `<span class="delay-badge-early">⚡ متقدم: ${Math.abs(delayVal)} د</span>`;
          } else {
            delayHtml = `<span class="delay-badge-ontime">🟢 في الموعد</span>`;
          }
        }

        const scheduledText = st.scheduled ? st.scheduled : '--';
        const actualText = (st.actual && st.actual !== '--') 
          ? `<div class="time-act">✅ وصل: ${st.actual}</div>` 
          : '';

        const row = document.createElement('div');
        row.className = 'station-node';
        row.innerHTML = `
          <div class="big-dot ${isStoppedHere ? 'stopped-here' : ''}"></div>
          <div class="station-details">
            <span class="station-name">${st.name}</span>
            <div class="times-box">
              <div class="time-sched-line">
                <span class="time-sched">مجدول: <b>${scheduledText}</b></span>
                ${delayHtml}
              </div>
              ${actualText}
            </div>
          </div>
        `;
        map.appendChild(row);

        if (idx < train.stations.length - 1) {
          const isMovingHere = (train.status.state === 'MOVING' && train.status.stationIndex === idx);
          const isStoppedBetweenHere = (train.status.state === 'STOPPED_BETWEEN' && train.status.stationIndex === idx);

          let dotClass = '';
          if (isMovingHere) dotClass = 'moving-here';
          if (isStoppedBetweenHere) dotClass = 'stopped-between-here';

          const track = document.createElement('div');
          track.className = 'track-line';
          track.innerHTML = `<div class="small-dot ${dotClass}"></div>`;
          map.appendChild(track);
        }
      });
    }

    initMQTT();
  </script>
</body>
</html>
